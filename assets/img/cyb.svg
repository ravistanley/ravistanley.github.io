<!-- CYBERSECURITY PORTFOLIO HERO v3: fuller canvas, larger readable panels -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">

  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="42%" r="80%">
      <stop offset="0%" stop-color="#0c1928" />
      <stop offset="55%" stop-color="#070f1c" />
      <stop offset="100%" stop-color="#02050a" />
    </radialGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7df2ff" stop-opacity="0.5" />
      <stop offset="45%" stop-color="#19c7e8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#19c7e8" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="ringCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <linearGradient id="ringSlate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334155" stop-opacity="0" />
      <stop offset="50%" stop-color="#64748b" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="panelTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16283d" />
      <stop offset="100%" stop-color="#0a1622" />
    </linearGradient>

    <linearGradient id="barFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d1d2c" />
      <stop offset="100%" stop-color="#13283b" />
    </linearGradient>

    <filter id="glowSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <filter id="glowTight" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.2" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <pattern id="hexGrid" width="84" height="146" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#173049" stroke-width="1" opacity="0.5">
        <path d="M42 0 L84 24 L84 73 L42 97 L0 73 L0 24 Z" />
        <path d="M42 97 L84 121 L84 170 L42 194 L0 170 L0 121 Z" />
      </g>
    </pattern>

    <g id="nodeDot">
      <circle r="6" fill="#22d3ee" />
      <circle r="12" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.45" />
    </g>

    <g id="termHeader">
      <circle cx="16" cy="15" r="6" fill="#ef4444" opacity="0.9" />
      <circle cx="38" cy="15" r="6" fill="#fbbf24" opacity="0.9" />
      <circle cx="60" cy="15" r="6" fill="#34d399" opacity="0.9" />
    </g>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#hexGrid)" opacity="0.4" />

  <rect x="-40" y="0" width="40" height="1080" fill="#22d3ee" opacity="0.03">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="1960 0" dur="18s" repeatCount="indefinite" />
  </rect>

  <!-- top status bar -->
  <g transform="translate(740 56)">
    <rect width="440" height="64" rx="8" fill="url(#barFill)" stroke="#22d3ee" stroke-width="1" opacity="0.95" />
    <circle cx="34" cy="32" r="7" fill="#fbbf24">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite" />
    </circle>
    <text x="56" y="27" font-family="'Courier New',monospace" font-size="15" fill="#fbbf24">threat level: elevated</text>
    <text x="56" y="49" font-family="'Courier New',monospace" font-size="13" fill="#7da7bd">3 active sessions monitored</text>
  </g>

  <!-- bottom status bar -->
  <g transform="translate(740 962)">
    <rect width="440" height="64" rx="8" fill="url(#barFill)" stroke="#34d399" stroke-width="1" opacity="0.95" />
    <text x="24" y="27" font-family="'Courier New',monospace" font-size="15" fill="#6ee7b7">12,408 packets analyzed</text>
    <text x="24" y="49" font-family="'Courier New',monospace" font-size="13" fill="#7da7bd">uptime 142d 06h -- all systems nominal</text>
  </g>

  <!-- connectors -->
  <g stroke="#1f4f6b" stroke-width="1.2" stroke-dasharray="2 7" fill="none" opacity="0.65">
    <path d="M700 280 L860 420" />
    <path d="M1220 280 L1060 420" />
    <path d="M700 800 L860 660" />
    <path d="M1220 800 L1060 660" />
  </g>

  <!-- PANEL 1: red team recon terminal -->
  <g transform="translate(60 60)" filter="url(#glowSoft)">
    <rect width="640" height="400" rx="12" fill="url(#panelTop)" stroke="#22d3ee" stroke-width="1.2" />
  </g>
  <g transform="translate(60 60)">
    <rect width="640" height="400" rx="12" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.55" />
    <rect width="640" height="40" rx="12" fill="#0e2032" />
    <use href="#termHeader" x="18" y="4" />
    <text x="320" y="26" text-anchor="middle" font-family="'Courier New',monospace" font-size="14" fill="#9fc6da">recon@redteam -- nmap</text>
    <line x1="0" y1="40" x2="640" y2="40" stroke="#22d3ee" stroke-width="0.5" opacity="0.4" />

    <g font-family="'Courier New',monospace" font-size="17" fill="#5eead4">
      <text x="24" y="78">$ nmap -sV -p- target.internal</text>
      <text x="24" y="108" fill="#94a3b8">Starting scan -- 65535 ports</text>
      <text x="24" y="148">22/tcp    open   ssh     OpenSSH 8.2</text>
      <text x="24" y="178">80/tcp    open   http    nginx 1.18</text>
      <text x="24" y="208">443/tcp   open   https   nginx 1.18</text>
      <text x="24" y="238">445/tcp   open   smb     <tspan fill="#fbbf24">flagged</tspan></text>
      <text x="24" y="268">3389/tcp  open   rdp     Win Server</text>
      <text x="24" y="306" fill="#94a3b8">Host is up -- enumerating services...</text>
      <text x="24" y="350" fill="#7df2ff" font-size="18">root@kali:~# <tspan opacity="0.9">_</tspan>
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite" />
      </text>
    </g>
  </g>

  <!-- PANEL 2: reverse engineering disassembly -->
  <g transform="translate(1220 60)" filter="url(#glowSoft)">
    <rect width="640" height="400" rx="12" fill="url(#panelTop)" stroke="#a78bfa" stroke-width="1.2" />
  </g>
  <g transform="translate(1220 60)">
    <rect width="640" height="400" rx="12" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.55" />
    <rect width="640" height="40" rx="12" fill="#1c1530" />
    <use href="#termHeader" x="18" y="4" />
    <text x="320" y="26" text-anchor="middle" font-family="'Courier New',monospace" font-size="14" fill="#c7bbe8">disasm -- main.bin</text>
    <line x1="0" y1="40" x2="640" y2="40" stroke="#a78bfa" stroke-width="0.5" opacity="0.4" />

    <g font-family="'Courier New',monospace" font-size="16" fill="#c4b5fd">
      <text x="24" y="76"><tspan fill="#8a7fb0">0x4011a0</tspan>   push   rbp</text>
      <text x="24" y="104"><tspan fill="#8a7fb0">0x4011a1</tspan>   mov    rbp, rsp</text>
      <text x="24" y="132"><tspan fill="#8a7fb0">0x4011a4</tspan>   sub    rsp, 0x20</text>
      <text x="24" y="160"><tspan fill="#8a7fb0">0x4011a8</tspan>   cmp    eax, 0x1</text>
      <text x="24" y="188"><tspan fill="#8a7fb0">0x4011ab</tspan>   je     0x4011f0</text>
      <text x="24" y="216"><tspan fill="#8a7fb0">0x4011ad</tspan>   call   sub_402310</text>
      <text x="24" y="244"><tspan fill="#8a7fb0">0x4011b2</tspan>   test   al, al</text>
      <text x="24" y="272"><tspan fill="#8a7fb0">0x4011b4</tspan>   jnz    loc_4011f0</text>
      <text x="24" y="312" fill="#94a3b8" font-size="14">; raw hex</text>
      <text x="24" y="338" fill="#8fb3c4" font-size="14">55 48 89 e5 48 83 ec 20 83 f8 01 74 1a</text>
      <text x="24" y="362" fill="#8fb3c4" font-size="14">e8 12 34 00 00 84 c0 75 12 31 c0 c9 c3</text>
    </g>
  </g>

  <!-- PANEL 3: attack path / network graph -->
  <g transform="translate(60 660)" filter="url(#glowSoft)">
    <rect width="640" height="400" rx="12" fill="url(#panelTop)" stroke="#22d3ee" stroke-width="1.2" />
  </g>
  <g transform="translate(60 660)">
    <rect width="640" height="400" rx="12" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.55" />
    <rect width="640" height="40" rx="12" fill="#0e2032" />
    <use href="#termHeader" x="18" y="4" />
    <text x="320" y="26" text-anchor="middle" font-family="'Courier New',monospace" font-size="14" fill="#9fc6da">attack-path.map</text>
    <line x1="0" y1="40" x2="640" y2="40" stroke="#22d3ee" stroke-width="0.5" opacity="0.4" />

    <g font-family="'Courier New',monospace" font-size="14" fill="#9fb8c8">
      <g stroke="#22d3ee" stroke-width="1.4" fill="none" opacity="0.75">
        <path d="M80 96 L240 70" />
        <path d="M240 70 L420 118" />
        <path d="M420 118 L560 90" />
        <path d="M240 70 L300 250" />
        <path d="M300 250 L480 290" />
      </g>
      <g fill="#7df2ff">
        <circle r="4"><animateMotion dur="2.6s" repeatCount="indefinite" path="M80 96 L240 70" /></circle>
        <circle r="4"><animateMotion dur="2.8s" repeatCount="indefinite" path="M240 70 L420 118" /></circle>
        <circle r="4"><animateMotion dur="3.2s" repeatCount="indefinite" path="M240 70 L300 250" /></circle>
      </g>

      <g filter="url(#glowTight)">
        <use href="#nodeDot" x="80" y="96" />
        <use href="#nodeDot" x="240" y="70" />
        <use href="#nodeDot" x="420" y="118" />
        <use href="#nodeDot" x="300" y="250" />
      </g>
      <g filter="url(#glowTight)">
        <circle cx="480" cy="290" r="9" fill="none" stroke="#fbbf24" stroke-width="1.6">
          <animate attributeName="r" values="9;16;9" dur="2.2s" repeatCount="indefinite" />
          <animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite" />
        </circle>
        <circle cx="480" cy="290" r="5" fill="#fbbf24" />
      </g>

      <text x="56" y="128" font-size="15" fill="#bcd6e2">attacker</text>
      <text x="216" y="50" font-size="15" fill="#bcd6e2">pivot host</text>
      <text x="380" y="148" font-size="15" fill="#bcd6e2">lateral move</text>
      <text x="260" y="280" font-size="15" fill="#bcd6e2">internal svc</text>
      <text x="404" y="340" font-size="15" fill="#fbbf24">target -- compromised</text>

      <g stroke="#fbbf24" stroke-width="1.2" opacity="0.6">
        <circle cx="480" cy="290" r="28" fill="none" />
        <line x1="480" y1="254" x2="480" y2="270" />
        <line x1="480" y1="310" x2="480" y2="326" />
        <line x1="444" y1="290" x2="460" y2="290" />
        <line x1="500" y1="290" x2="516" y2="290" />
      </g>
    </g>
  </g>

  <!-- PANEL 4: exploit / shell terminal -->
  <g transform="translate(1220 660)" filter="url(#glowSoft)">
    <rect width="640" height="400" rx="12" fill="url(#panelTop)" stroke="#34d399" stroke-width="1.2" />
  </g>
  <g transform="translate(1220 660)">
    <rect width="640" height="400" rx="12" fill="none" stroke="#34d399" stroke-width="1" opacity="0.55" />
    <rect width="640" height="40" rx="12" fill="#0e2620" />
    <use href="#termHeader" x="18" y="4" />
    <text x="320" y="26" text-anchor="middle" font-family="'Courier New',monospace" font-size="14" fill="#a3e6cb">session -- shell</text>
    <line x1="0" y1="40" x2="640" y2="40" stroke="#34d399" stroke-width="0.5" opacity="0.4" />

    <g font-family="'Courier New',monospace" font-size="17" fill="#6ee7b7">
      <text x="24" y="80">msf6 &gt; exploit -j</text>
      <text x="24" y="110" fill="#94a3b8">[*] Sending stage payload...</text>
      <text x="24" y="140" fill="#94a3b8">[*] Session 1 opened</text>
      <text x="24" y="178">meterpreter &gt; sysinfo</text>
      <text x="24" y="206" fill="#94a3b8">OS: Linux x86_64</text>
      <text x="24" y="236">meterpreter &gt; getuid</text>
      <text x="24" y="264" fill="#94a3b8">Server username: root</text>
      <text x="24" y="306" fill="#7df2ff" font-size="18">meterpreter &gt; <tspan opacity="0.9">_</tspan>
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite" />
      </text>
    </g>
  </g>

  <!-- central core -->
  <g opacity="0.9">
    <animateTransform attributeName="transform" type="rotate" from="0 960 540" to="360 960 540" dur="220s" repeatCount="indefinite" />
    <circle cx="960" cy="540" r="210" fill="none" stroke="url(#ringSlate)" stroke-width="1" />
    <circle cx="960" cy="540" r="210" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="1 12" opacity="0.5" />
  </g>

  <g style="mix-blend-mode:screen">
    <g transform="translate(960 540)">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="9s" repeatCount="indefinite" additive="sum" />
      <path d="M0 0 L0 -168 A168 168 0 0 1 41 -163 Z" fill="url(#sweepGrad)" />
    </g>
    <circle cx="960" cy="540" r="168" fill="none" stroke="#0e7490" stroke-width="1" opacity="0.4" />
  </g>

  <g filter="url(#glowSoft)">
    <circle cx="960" cy="540" r="168" fill="url(#coreGlow)" />
  </g>

  <g transform="translate(960 540) scale(0.95)">
    <path d="M0 -92 L74 -64 L74 18 C74 70 40 104 0 124 C-40 104 -74 70 -74 18 L-74 -64 Z"
          fill="#0c1f2e" stroke="url(#ringCyan)" stroke-width="2.5" filter="url(#glowTight)" />
    <path d="M0 -78 L60 -54 L60 16 C60 58 32 86 0 104 C-32 86 -60 58 -60 16 L-60 -54 Z"
          fill="none" stroke="#22d3ee" stroke-width="0.75" opacity="0.45" />
    <rect x="-26" y="2" width="52" height="42" rx="6" fill="none" stroke="#7df2ff" stroke-width="2.5" />
    <path d="M-15 2 V-14 a15 15 0 0 1 30 0 V2" fill="none" stroke="#7df2ff" stroke-width="2.5" />
    <circle cx="0" cy="22" r="4.5" fill="#7df2ff" />
    <line x1="0" y1="22" x2="0" y2="32" stroke="#7df2ff" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <text x="960" y="780" text-anchor="middle" font-family="'Courier New',monospace" font-size="16" fill="#7df2ff" opacity="0.85">SECURE CORE</text>

  <g opacity="0.7">
    <animateTransform attributeName="transform" type="rotate" from="0 960 540" to="360 960 540" dur="34s" repeatCount="indefinite" />
    <circle cx="960" cy="540" r="140" fill="none" stroke="url(#ringCyan)" stroke-width="1.5" stroke-dasharray="3 8" />
  </g>

</svg>
